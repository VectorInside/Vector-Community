<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Vector Inside Emblem Mark -->
  <g transform="translate(10, 8)">
    <rect width="44" height="44" rx="10" fill="#12151A" stroke="#1F242D" stroke-width="1.5"/>
