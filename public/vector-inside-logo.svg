  </g>

  <!-- Typography: VECTOR INSIDE -->
  <text x="66" y="30" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing="0.12em">VECTOR</text>
  <text x="145" y="30" fill="#D4FF00" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing="0.12em">INSIDE</text>
  <text x="67" y="44" fill="#71717A" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.25em">COMMUNITY CONTROL PANEL</text>
